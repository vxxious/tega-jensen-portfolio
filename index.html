<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f8" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('tega-theme')
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d0d0d' : '#f8f8f8'
        } catch {}
      })()
    </script>
    <meta name="description" content="Tega Jensen is an AI evaluation and content quality specialist focused on accurate, coherent, safe, and well-documented AI outputs." />
    <link rel="canonical" href="https://tega-jensen-portfolio.vercel.app/" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Tega Jensen — AI Evaluation & Content Quality Specialist" />
    <meta property="og:description" content="AI evaluation, content quality, data annotation, quality assurance, and research experience." />
    <meta property="og:url" content="https://tega-jensen-portfolio.vercel.app/" />
    <meta property="og:image" content="https://tega-jensen-portfolio.vercel.app/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  </head>

</html>
